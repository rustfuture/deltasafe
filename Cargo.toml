[package]
name = "deltasafe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
blake3 = "1.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"
indicatif = "0.17"
anyhow = "1.0"
pbkdf2 = "0.12"
sha2 = "0.10"
hkdf = "0.12"
tokio = { version = "1.0", features = ["full"] }
mdns-sd = "0.11"
tempfile = "3"
